<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>XingChen-AGI/Xing4.0-29B-A4B MoE - Musfira AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="w-full max-w-lg bg-gray-800 rounded-lg shadow-lg p-6">
    <h1 class="text-xl font-bold mb-4">XingChen-AGI/Xing4.0-29B-A4B MoE</h1>
    <div id="chat-log" class="space-y-2 h-80 overflow-y-auto mb-4 text-sm"></div>
    <div class="flex gap-2">
      <input id="chat-input" class="flex-1 rounded px-3 py-2 text-black" placeholder="Ask something..." />
      <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">Send</button>
    </div>
    <p class="text-xs text-gray-400 mt-4">Powered by Musfira AI · local Ollama backend</p>
  </div>

  <script>
    const log = document.getElementById("chat-log");
    const input = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(role, text) {
      const el = document.createElement("div");
      el.className = role === "user" ? "text-right text-blue-300" : "text-left text-gray-200";
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    async function sendMessage() {
      const prompt = input.value.trim();
      if (!prompt) return;
      appendMessage("user", prompt);
      input.value = "";
      try {
        const res = await fetch("http://localhost:11434/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model: "llama3", prompt, stream: false })
        });
        const data = await res.json();
        appendMessage("assistant", data.response || "(no response)");
      } catch (err) {
        appendMessage("assistant", "Error: local Ollama server not reachable.");
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
